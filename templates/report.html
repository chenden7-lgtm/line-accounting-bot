<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極報表中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-color: #ff5722; }
        body { background-color: #f1f3f5; padding-bottom: 80px; font-family: sans-serif; }
        .nav-bar { background: white; padding: 12px; box-shadow: 0 -2px 15px rgba(0,0,0,0.05); position: fixed; bottom: 0; width: 100%; z-index: 100; display: flex; }
        .nav-btn { color: #aaa; text-decoration: none; font-size: 0.7rem; text-align: center; flex: 1; }
        .nav-btn.active { color: var(--primary-color); font-weight: bold; }
        .card { border: none; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .flow-inc { color: #28a745; font-size: 1.5rem; font-weight: bold; }
        .flow-exp { color: #dc3545; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h4 class="fw-bold mb-4">📈 財務報表中心</h4>
        
        <div class="card p-4 text-center">
            <h6 class="text-muted small">本月收支概況</h6>
            <div class="row mt-3">
                <div class="col-6">
                    <small>總收入</small><br>
                    <span class="flow-inc">+$ {{ flow.get('income', 0) }}</span>
                </div>
                <div class="col-6">
                    <small>總支出</small><br>
                    <span class="flow-exp">-$ {{ flow.get('expense', 0) }}</span>
                </div>
            </div>
            <canvas id="flowChart" class="mt-4" style="max-height: 180px;"></canvas>
        </div>

        <div class="card p-4">
            <h6 class="fw-bold mb-3">🔥 支出排行榜</h6>
            {% for exp in top_expenses %}
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="badge bg-light text-dark me-2">Top {{ loop.index }}</span>
                    <span class="fw-bold">{{ exp.category }}</span>
                </div>
                <span class="text-danger fw-bold">$ {{ exp.s }}</span>
            </div>
            <div class="progress mb-3" style="height: 6px;">
                <div class="progress-bar bg-danger opacity-75" style="width: {{ (exp.s / (flow.get('expense', 1))) * 100 }}%"></div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="nav-bar">
        <a href="/" class="nav-btn">📊<br>總覽</a>
        <a href="/?type=personal" class="nav-btn">🏠<br>私人</a>
        <a href="/?type=company" class="nav-btn">🏢<br>公司</a>
        <a href="/?type=report" class="nav-btn active">📈<br>報表</a>
        <a href="/?type=settings" class="nav-btn">⚙️<br>設定</a>
    </div>

    <script>
        const ctx = document.getElementById('flowChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['收入', '支出'],
                datasets: [{
                    data: [{{ flow.get('income', 1) }}, {{ flow.get('expense', 1) }}],
                    backgroundColor: ['#28a745', '#dc3545'],
                    borderWidth: 0,
                    cutout: '75%'
                }]
            },
            options: { plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
