<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>設定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --p: #ff5722; }
        body { background: #f8f9fa; padding-bottom: 100px; font-family: sans-serif; }
        .st-header { background: #000; color: white; padding: 40px 20px; text-align: center; }
        .st-card { background: white; border-radius: 20px; padding: 25px; margin: -20px 20px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid #eee; padding-bottom: env(safe-area-inset-bottom); height: 80px; z-index: 10000; }
        .nav-link { text-decoration: none !important; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; }
        .nav-link.active { color: var(--p); }
        .nav-text { font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="st-header"><h4 class="fw-bold">⚙️ 系統設定</h4></div>
    <div class="st-card">
        <form action="/update_settings" method="POST">
            <div class="mb-3">
                <label class="small text-muted fw-bold">帳本 1</label>
                <input type="text" name="n1" class="form-control p-3" value="{{ names.personal }}">
            </div>
            <div class="mb-3">
                <label class="small text-muted fw-bold">帳本 2</label>
                <input type="text" name="n2" class="form-control p-3" value="{{ names.company }}">
            </div>
            <div class="mb-3">
                <label class="small text-muted fw-bold">帳本 3</label>
                <input type="text" name="n3" class="form-control p-3" value="{{ names.invest }}">
            </div>
            <button type="submit" class="btn btn-dark w-100 p-3 fw-bold" style="border-radius:15px;">儲存修改內容</button>
        </form>
        <div class="mt-4 text-center small text-muted">版本：v6.1 Stable</div>
    </div>

    <div class="bottom-nav">
        <a href="/" class="nav-link"><span style="font-size:1.4rem;">📊</span><span class="nav-text">總覽</span></a>
        <a href="/?type=personal" class="nav-link"><span style="font-size:1.4rem;">🏠</span><span class="nav-text">{{ names.personal[:2] }}</span></a>
        <a href="/?type=company" class="nav-link"><span style="font-size:1.4rem;">🏢</span><span class="nav-text">{{ names.company[:2] }}</span></a>
        <a href="/?type=invest" class="nav-link"><span style="font-size:1.4rem;">💰</span><span class="nav-text">{{ names.invest[:2] }}</span></a>
        <a href="/?type=report" class="nav-link"><span style="font-size:1.4rem;">📈</span><span class="nav-text">報表</span></a>
        <a href="/?type=settings" class="nav-link active"><span style="font-size:1.4rem;">⚙️</span><span class="nav-text">設定</span></a>
    </div>
</body>
</html>
