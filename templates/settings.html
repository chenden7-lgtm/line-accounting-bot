<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>滷蛋記帳：系統設定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f9fc; padding-bottom: 100px; font-family: sans-serif; }
        .header-settings { background: #121212; padding: 40px 20px; border-radius: 0 0 35px 35px; color: white; text-align: center; }
        .config-card { background: white; border-radius: 25px; padding: 25px; margin: -20px 15px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .label-custom { font-size: 0.8rem; font-weight: bold; color: #888; margin-bottom: 6px; display: block; }
        .input-custom { border-radius: 12px; border: 2px solid #f1f3f6; padding: 12px; font-weight: 600; margin-bottom: 15px; }
        .btn-save { background: #121212; color: white; width: 100%; border-radius: 15px; padding: 14px; border: none; font-weight: bold; }
        
        /* 6 鍵穩定導覽列 CSS (與總覽、記帳頁完全一致) */
        .nav-bar-stable { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #efefef; display: grid; grid-template-columns: repeat(6, 1fr); padding: 10px 0 env(safe-area-inset-bottom); z-index: 9999; }
        .nav-item-new { text-decoration: none !important; color: #bbb; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-item-new span { font-size: 1.2rem; display: block; filter: grayscale(1); opacity: 0.5; }
        .nav-item-new small { font-size: 0.6rem; font-weight: bold; margin-top: 2px; color: #b2bec3; }
        .nav-item-new.active span { filter: grayscale(0); opacity: 1; transform: translateY(-3px); }
        .nav-item-new.active small { color: #ff5722; }
    </style>
</head>
<body>
    <div class="header-settings">
        <h5 class="fw-bold">⚙️ 系統設定</h5>
        <p class="opacity-50 small">自定義您的專屬帳本名稱</p>
    </div>

    <div class="config-card">
        <form action="/update_settings" method="POST">
            <span class="label-custom">帳本 1 名稱 (預設私人)</span>
            <input type="text" name="n1" class="form-control input-custom" value="{{ names.personal }}">

            <span class="label-custom">帳本 2 名稱 (預設公司)</span>
            <input type="text" name="n2" class="form-control input-custom" value="{{ names.company }}">

            <span class="label-custom">帳本 3 名稱 (預設投資)</span>
            <input type="text" name="n3" class="form-control input-custom" value="{{ names.invest }}">

            <button type="submit" class="btn-save mt-2">儲存修改資訊</button>
        </form>
    </div>

    <!-- 終極 6 鍵導覽列元件 -->
    <div class="nav-bar-stable">
        <a href="/" class="nav-item-new"><span>📊</span><small>總覽</small></a>
        <a href="/?type=personal" class="nav-item-new"><span>🏠</span><small>私人</small></a>
        <a href="/?type=company" class="nav-item-new"><span>🏢</span><small>公司</small></a>
        <a href="/?type=invest" class="nav-item-new"><span>💰</span><small>投資</small></a>
        <a href="/?type=report" class="nav-item-new"><span>📈</span><small>報表</small></a>
        <a href="/?type=settings" class="nav-item-new active"><span>⚙️</span><small>設定</small></a>
    </div>
</body>
</html>
