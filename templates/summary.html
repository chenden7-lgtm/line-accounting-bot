<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>滷蛋記帳</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --p: #ff6b35; --income: #2ec4b6; --expense: #e71d36; }
        body { background: #f7f9fc; padding-bottom: 110px; font-family: sans-serif; }
        .header { background: #121212; padding: 40px 20px 60px; border-radius: 0 0 35px 35px; color: white; text-align: center; }
        .glass-card { border: none; border-radius: 25px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin: -40px 15px 20px; padding: 20px; position: relative; z-index: 10; }
        .toggle-box { display: flex; background: #f1f3f6; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .toggle-btn { flex: 1; border: none; background: none; padding: 10px; border-radius: 10px; font-weight: bold; color: #888; }
        .toggle-btn.active-exp { background: white; color: var(--expense); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .toggle-btn.active-inc { background: white; color: var(--income); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-elegant { border: none; border-radius: 15px; padding: 14px; font-weight: bold; color: white; width: 100%; }
        .item-row { background: white; border-radius: 18px; padding: 15px; margin: 0 15px 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .nav-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-between; padding: 10px 5px; z-index: 1000; }
        .nav-item { text-decoration: none; color: #bbb; font-size: 0.65rem; text-align: center; flex: 1; }
        .nav-item span { font-size: 1.1rem; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--p); font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h6 class="opacity-50 small mb-1">{{ names.get(current_type) }}</h6>
        <h1 class="fw-bold">$ {{ total }}</h1>
    </div>
    <div class="glass-card">
        <form action="/add" method="POST">
            <input type="hidden" name="account_type" value="{{ current_type }}">
            <input type="hidden" name="entry_type" id="e_type" value="expense">
            <div class="toggle-box" style="display:flex;">
                <button type="button" id="e_btn" class="toggle-btn active-exp" onclick="setE('expense')">支出</button>
                <button type="button" id="i_btn" class="toggle-btn" onclick="setE('income')">收入</button>
            </div>
            <div class="row g-2">
                <div class="col-6"><input type="number" name="amount" class="form-control" placeholder="0" required></div>
                <div class="col-6"><input type="text" name="category" class="form-control" placeholder="項目" required></div>
                <div class="col-12 mt-3"><button type="submit" id="main_btn" class="btn-elegant" style="background:var(--expense)">存入紀錄</button></div>
            </div>
        </form>
    </div>
    {% for r in records %}
    <div class="item-row">
        <div><div class="fw-bold">{{ r.category }}</div><small class="text-muted" style="font-size:0.6rem">{{ r.created_at }}</small></div>
        <div class="d-flex align-items-center">
            <b class="{{ 'text-danger' if r.entry_type == 'expense' else 'text-success' }} me-3">{{ '-' if r.entry_type == 'expense' else '+' }}${{ r.amount }}</b>
            <form action="/delete/{{ r.id }}?type={{ current_type }}" method="POST"><button type="submit" style="border:none; background:none; color:#ddd; font-size:1.2rem;">&times;</button></form>
        </div>
    </div>
    {% endfor %}
    <div class="nav-fixed">
        <a href="/" class="nav-item"><span>📊</span>總覽</a>
        <a href="/?type=personal" class="nav-item {{ 'active' if current_type == 'personal' }}"><span>🏠</span>私人</a>
        <a href="/?type=company" class="nav-item {{ 'active' if current_type == 'company' }}"><span>🏢</span>公司</a>
        <a href="/?type=invest" class="nav-item {{ 'active' if current_type == 'invest' }}"><span>💰</span>投資</a>
        <a href="/?type=report" class="nav-item {{ 'active' if current_type == 'report' }}"><span>📈</span>報表</a>
        <a href="/?type=settings" class="nav-item {{ 'active' if current_type == 'settings' }}"><span>⚙️</span>設定</a>
    </div>
    <script>
        function setE(t) {
            document.getElementById('e_type').value = t;
            document.getElementById('e_btn').classList.toggle('active-exp', t === 'expense');
            document.getElementById('i_btn').classList.toggle('active-inc', t === 'income');
            const b = document.getElementById('main_btn');
            b.innerText = t === 'expense' ? '存入支出' : '存入收入';
            b.style.background = t === 'expense' ? 'var(--expense)' : 'var(--income)';
        }
    </script>
</body>
</html>
