<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{{background:#f8f9fa;padding-bottom:80px;}}.bot-nav{{position:fixed;bottom:0;left:0;right:0;background:white;display:grid;grid-template-columns:repeat(5,1fr);height:70px;border-top:1px solid #eee;text-align:center;padding-top:10px;}}.nav-i{{text-decoration:none;color:#ccc;font-size:0.7rem;}}.nav-i.active{{color:#ff5722;weight:bold;}}</style>
</head><body>
<div style="background:#121212;color:white;padding:30px;text-align:center;"><small>{{ names.get(current_type) }}</small><h1>$ {{ total }}</h1></div>
<div class="card m-3 p-3 shadow-sm"><form action="/add" method="POST">
<input type="hidden" name="account_type" value="{{ current_type }}">
<select name="entry_type" class="form-select mb-2"><option value="expense">支出</option><option value="income">收入</option></select>
<div class="row g-2"><div class="col-6"><input type="number" name="amount" class="form-control" placeholder="金額" required></div>
<div class="col-6"><input type="text" name="category" class="form-control" placeholder="項目" required></div></div>
<button class="btn btn-danger w-100 mt-3 p-2">確認存入</button></form></div>
<div class="px-3">{% for r in records %}<div class="card p-2 mb-2"><b>{{ r.category }}</b> ${{ r.amount }} ({{'收入' if r.entry_type=='income' else '支出'}})</div>{% endfor %}</div>
<div class="bot-nav">
<a href="/?type=summary" class="nav-i">📊<br>總覽</a>
<a href="/?type=personal" class="nav-i {{ 'active' if current_type=='personal' }}">🏠<br>{{names.personal[:2]}}</a>
<a href="/?type=company" class="nav-i {{ 'active' if current_type=='company' }}">🏢<br>{{names.company[:2]}}</a>
<a href="/?type=invest" class="nav-i {{ 'active' if current_type=='invest' }}">💰<br>{{names.invest[:2]}}</a>
<a href="/?type=settings" class="nav-i">⚙️<br>設定</a>
</div></body></html>
