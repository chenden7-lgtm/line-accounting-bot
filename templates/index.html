<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>滷蛋專屬記帳 v3.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #ff5722; --bg-color: #f8f9fa; }
        body { background-color: var(--bg-color); font-family: sans-serif; }
        .header-section { background: linear-gradient(135deg, #ff5722 0%, #ff9800 100%); color: white; padding: 30px 20px; border-radius: 0 0 25px 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: -20px; }
        .nav-pills .nav-link { border-radius: 15px; color: #661; margin: 0 5px; }
        .nav-pills .nav-link.active { background-color: var(--primary-color) !important; color: white !important; }
        .btn-submit { background-color: #333; color: white; border-radius: 12px; border: none; width: 100%; padding: 12px; font-weight: bold; }
        .amount-text { color: #ff5722; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="header-section text-center">
        <h3 class="fw-bold">🥚 滷蛋專屬記帳 v3.0</h3>
        <p class="opacity-75 small">快速記錄每一筆支出</p>
        <h2 class="mt-2 fw-bold">$ {{ total }}</h2>
    </div>

    <div class="container mb-5">
        <ul class="nav nav-pills nav-fill bg-white p-2 card flex-row mx-auto mb-4" style="max-width: 400px;">
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_type == 'personal' }}" href="/?type=personal">🏠 私人私帳</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_type == 'company' }}" href="/?type=company">🏢 公司公帳</a>
            </li>
        </ul>

        <div class="card p-4 mb-4">
            <h6 class="fw-bold mb-3">📍 新增 {% if current_type == 'personal' %}私人{% else %}公司{% endif %}紀錄</h6>
            <form action="/add" method="POST">
                <input type="hidden" name="account_type" value="{{ current_type }}">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="small text-muted">金額</label>
                        <input type="number" name="amount" class="form-control" placeholder="0" required inputmode="numeric">
                    </div>
                    <div class="col-6">
                        <label class="small text-muted">類別</label>
                        <input type="text" name="category" class="form-control" placeholder="如: 晚餐" required>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn-submit">存入紀錄</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card p-3">
            <h6 class="fw-bold mb-3">歷史細目</h6>
            <div class="list-group list-group-flush">
                {% if not records %}
                <div class="text-center py-4 text-muted small">目前尚無紀錄</div>
                {% endif %}
                {% for record in records %}
                <div class="list-group-item d-flex justify-content-between align-items-center px-0">
                    <div>
                        <div class="fw-bold">{{ record.category }}</div>
                        <small class="text-muted" style="font-size: 0.7rem;">{{ record.created_at }}</small>
                    </div>
                    <div class="amount-text">-$ {{ record.amount }}</div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
