<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>滷蛋記帳</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> \
    .bot-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid #eee; padding: 10px 0 env(safe-area-inset-bottom); height: 75px; z-index: 9999; } \
    .nav-i { text-decoration: none !important; color: #ccc; text-align: center; font-size: 0.65rem; font-weight: bold; } \
    .nav-i span { font-size: 1.3rem; margin-bottom: 2px; display: inline-block; } \
    .nav-i.active { color: #ff5722; } \
</style>
    <style>
        body { background: #f8f9fa; padding-bottom: 90px; }
        .head { background: #000; color: white; padding: 40px 20px 60px; text-align: center; }
        .card-main { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: -40px 20px 20px; padding: 20px; }
        .type-sel { display: grid; grid-template_columns: 1fr 1fr; background: #eee; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .t-btn { border: none; background: none; padding: 10px; border-radius: 9px; font-weight: bold; color: #888; flex: 1; }
        .t-btn.active { background: white; color: #ff5722; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .row-item { background: white; border-radius: 15px; padding: 15px; margin: 0 20px 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f1f1; }
    </style>
</head>
<body>
    <div class="head">
        <h6 class="opacity-50 small mb-1">{{ names.get(current_type) }}結餘</h6>
        <h1 class="fw-bold">$ {{ total }}</h1>
    </div>
    <div class="card-main">
        <form action="/add" method="POST">
            <input type="hidden" name="account_type" value="{{ current_type }}">
            <input type="hidden" name="entry_type" id="et" value="expense">
            <div style="display:flex; background:#eee; border-radius:12px; padding:4px; margin-bottom:20px;">
                <button type="button" id="eb" class="t-btn active" onclick="st('expense')" style="width:50%;">支出</button>
                <button type="button" id="ib" class="t-btn" onclick="st('income')" style="width:50%;">收入</button>
            </div>
            <div class="row g-2">
                <div class="col-6"><input type="number" name="amount" class="form-control" placeholder="金額" required></div>
                <div class="col-6"><input type="text" name="category" class="form-control" placeholder="項目" required></div>
                <div class="col-12 mt-3"><button type="submit" id="sb" class="btn w-100 p-3 fw-bold text-white" style="background:#dc3545; border-radius:12px;">存入紀錄</button></div>
            </div>
        </form>
    </div>
    {% for r in records %}
    <div class="row-item">
        <div><div class="fw-bold">{{ r.category }}</div><small class="text-muted">{{ r.created_at }}</small></div>
        <div class="d-flex align-items-center">
            <b class="{{ 'text-success' if r.entry_type == 'income' else 'text-danger' }}">
                {{ '+' if r.entry_type == 'income' else '-' }}${{ r.amount }}
            </b>
            <form action="/delete/{{ r.id }}?type={{ current_type }}" method="POST" class="ms-3"><button type="submit" style="border:none; background:none; color:#ddd; font-size:1.2rem;">&times;</button></form>
        </div>
    </div>
    {% endfor %}
    <div class="bot-nav"> \
    <a href="/" class="nav-i {{ "active" if current_type == "summary" }}"><span>📊</span><br>總覽</a> \
    <a href="/?type=personal" class="nav-i {{ "active" if current_type == "personal" }}"><span>🏠</span><br>{{ names.personal[:2] }}</a> \
    <a href="/?type=company" class="nav-i {{ "active" if current_type == "company" }}"><span>🏢</span><br>{{ names.company[:2] }}</a> \
    <a href="/?type=invest" class="nav-i {{ "active" if current_type == "invest" }}"><span>💰</span><br>{{ names.invest[:2] }}</a> \
    <a href="/?type=report" class="nav-i {{ "active" if current_type == "report" }}"><span>📈</span><br>報表</a> \
    <a href="/?type=settings" class="nav-i {{ "active" if current_type == "settings" }}"><span>⚙️</span><br>設定</a> \
</div>
    <script>
        function st(t) {
            document.getElementById('et').value = t;
            document.getElementById('eb').className = (t === 'expense' ? 't-btn active' : 't-btn');
            document.getElementById('ib').className = (t === 'income' ? 't-btn active' : 't-btn');
            document.getElementById('sb').style.background = (t === 'expense' ? '#dc3545' : '#28a745');
        }
    </script>
</body>
</html>
