<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小蛋統計 - {{ ledgers[current_type] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: none; }
    </style>
</head>
<body class="container py-4">
    <div class="mb-4">
        <a href="/?type={{ current_type }}" class="btn btn-link text-dark p-0 text-decoration-none">← 返回帳本</a>
        <h2 class="mt-2">📊 {{ ledgers[current_type] }} - 分析統計</h2>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card p-4 h-100">
                <h5 class="text-center mb-4">支出分類占比</h5>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-4 h-100">
                <h5 class="text-center mb-4">類別支出排行</h5>
                <div id="rankingList">
                    {% for i in range(cat_labels|length) %}
                    <div class="d-flex justify-content-between mb-2">
                        <span>{{ cat_labels[i] }}</span>
                        <span class="fw-bold">${{ "{:,}".format(cat_values[i]) }}</span>
                    </div>
                    <div class="progress mb-3" style="height: 10px;">
                        <div class="progress-bar bg-warning" style="width: 70%"></div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: {{ cat_labels|tojson }},
                datasets: [{
                    data: {{ cat_values|tojson }},
                    backgroundColor: [
                        '#ffd43b', '#fab005', '#f08c00', '#e67700', '#d9480f'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                plugins: {
                    legend: { position: 'bottom' }
                },
                cutout: '70%'
            }
        });
    </script>
</body>
</html>
