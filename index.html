<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小蛋記帳 - 靜態預覽版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-pills .nav-link.active { background-color: #ffc107; color: black; }
    </style>
</head>
<body class="container py-4">
    <h2 class="text-center mb-4">🥚 小蛋記帳 (預覽介面)</h2>

    <ul class="nav nav-pills nav-fill mb-4">
        <li class="nav-item"><a class="nav-link active" href="#">公司公帳</a></li>
        <li class="nav-item"><a class="nav-link" href="#">私人私帳</a></li>
    </ul>

    <div class="card p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-3"><input type="number" class="form-control" placeholder="金額"></div>
            <div class="col-md-3"><input type="text" class="form-control" placeholder="類別 (例: 餐飲)"></div>
            <div class="col-md-4"><input type="text" class="form-control" placeholder="備註"></div>
            <div class="col-md-2"><button class="btn btn-warning w-100">新增紀錄</button></div>
        </div>
    </div>

    <div class="card p-0 overflow-hidden">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr><th>日期</th><th>類別</th><th>金額</th><th>備註</th></tr>
            </thead>
            <tbody>
                <tr><td>2026-05-23</td><td><span class="badge bg-secondary">辦公室租金</span></td><td class="text-danger fw-bold">$1000</td><td>5月租金</td></tr>
            </tbody>
            <tfoot class="table-warning">
                <tr><td colspan="2" class="text-end fw-bold">總計:</td><td colspan="2" class="fw-bold">$1000</td></tr>
            </tfoot>
        </table>
    </div>
    <p class="text-center mt-4 text-danger">⚠️ 系統環境暫時無法安裝 Flask，我改用靜態網頁讓你先看 UI 介面。</p>
</body>
</html>
